name: Paper E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4
        ports: ["6385:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s
          --health-timeout=3s --health-retries=20
    env:
      TEST_TIMEOUT: "120000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Auxilor/EcoJobs
          ref: 110b9597ec93d78685b8e63ee136d75d63f8c97e
          path: e2e-ecojobs
      - name: Build the official EcoJobs runtime distribution
        working-directory: e2e-ecojobs
        run: ./gradlew --no-daemon libreforgeJar
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: alexey-va/ARC
          ref: 65ec2606c974cfc4802b03606b8b3d69e78ae201
          path: e2e-arc
      - name: Build the pinned ARC runtime
        working-directory: e2e-arc
        run: ./gradlew --no-daemon shadowJar
      - name: Record staged runtime hashes
        run: |
          sha256sum \
            "e2e-ecojobs/bin/EcoJobs v2026.33.jar" \
            e2e-arc/build/libs/ARC-1.4.4.jar
      - name: Run ArcEcoJobs on real Paper
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          ./gradlew --no-daemon plugwrightTest \
            -Pe2eArcJar="$GITHUB_WORKSPACE/e2e-arc/build/libs/ARC-1.4.4.jar" \
            2>&1 | tee build/plugwright-e2e.log
          git diff --exit-code -- src/test/e2e/package-lock.json
          sha256sum build/libs/ArcEcoJobs-0.1.20.jar e2e-arc/build/libs/ARC-1.4.4.jar > build/tested-plugin-sha256.txt
      - name: Retain the exact tested plugins
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: job-work-tested-plugins
          retention-days: 7
          if-no-files-found: error
          path: |
            build/libs/ArcEcoJobs-0.1.20.jar
            e2e-arc/build/libs/ARC-1.4.4.jar
            build/tested-plugin-sha256.txt
      - name: Upload Paper logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arcecojobs-paper-e2e
          retention-days: 7
          path: |
            build/plugwright-e2e.log
            build/plugwright/logs/
            build/plugwright/crash-reports/
