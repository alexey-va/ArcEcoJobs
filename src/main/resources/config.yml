locale:
  default: ru
  use-client-locale: true

commands:
  intercept-ecojobs-root: true

leaderboards:
  cache-seconds: 300
  entries-per-page: 10

boosts:
  stacking: MAX
  cache-millis: 1000
  minimum-multiplier: 1.01
  maximum-multiplier: 10.0
  maximum-duration: 30d
  maximum-stacked-duration: 365d
  require-money-placeholder: true

# Required for redeeming signed vouchers safely across multiple servers.
# The table stores redemption identities only; LuckPerms still owns active boosts.
redemptions:
  mysql:
    enabled: false
    host: 127.0.0.1
    port: 3306
    database: minecraft
    username: minecraft
    password: ''
    ssl-mode: REQUIRED
    pool:
      minimum-idle: 1
      maximum-size: 4
      connection-timeout-ms: 10000
      validation-timeout-ms: 5000
      max-lifetime-ms: 1700000

gui:
  items:
    background:
      material: GRAY_STAINED_GLASS_PANE
    back:
      material: BLUE_STAINED_GLASS_PANE
    previous:
      material: BLUE_STAINED_GLASS_PANE
    next:
      material: BLUE_STAINED_GLASS_PANE
    close:
      material: RED_STAINED_GLASS_PANE
    confirm:
      material: GREEN_STAINED_GLASS_PANE
    cancel:
      material: RED_STAINED_GLASS_PANE
    refresh:
      material: REPEATER
    catalog:
      material: CRAFTING_TABLE
