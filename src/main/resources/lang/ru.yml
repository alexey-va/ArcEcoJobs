dialog:
  shop:
    description: 'Выберите усиление. Стоимость указана в предложении; активация — ПКМ по талону.'
  shop-confirm:
    description: 'Проверьте эффект, время действия и стоимость перед покупкой.'
  close-tooltip: '<#969696>Вернуться в игру. Настройка Escape общая с меню ARC.'
  main:
    back: '<#969696>Главное меню'
    description: '<italic:false><#e6fff3>Выберите профессию и получайте деньги и опыт за её действия.<newline><newline><#c8a477>Разделы<#e6fff3><newline>Каталог — выбор профессии; мои работы — ваш прогресс.<newline>Лидеры — рейтинг; усиления — действующие бонусы.'
  catalog:
    description: '<italic:false><#e6fff3>Сравните профессии и выберите подходящую.<newline><#969696>В карточке — условия вступления, уровни, доход и усиления.'
  active:
    description: '<italic:false><#e6fff3>Ваши действующие профессии и текущий прогресс.<newline><#969696>Откройте карточку, чтобы посмотреть доход, награды и усиления.'
  job:
    description: '<italic:false><#e6fff3>Развивайте профессию, выполняя её игровые действия.<newline><#969696>Уровни и награды, история дохода, рейтинг и усиления — ниже.'
  leave:
    description: '<italic:false><#e6fff3>Вы собираетесь покинуть профессию.<newline><#969696>Проверьте условия ниже. Выход произойдёт только после подтверждения.'
  levels:
    description: '<italic:false><#e6fff3>Награды и требования каждого уровня профессии.<newline><#969696>Откройте уровень, чтобы прочитать все награды и условия.'
  earnings:
    description: '<italic:false><#e6fff3>История денег и опыта, полученных в этой профессии.<newline><#969696>Выберите день для разбивки по часам.'
  earnings-hours:
    description: '<italic:false><#e6fff3>Деньги и опыт за выбранный день по часам.<newline><#969696>Выберите час, чтобы посмотреть суммы.'
  leaderboard-selector:
    description: '<italic:false><#e6fff3>Сравните прогресс игроков во всех профессиях или в одной.<newline><#969696>Выберите общий рейтинг или нужную профессию.'
  leaderboard:
    description: '<italic:false><#e6fff3>Места игроков по уровню и опыту профессий.<newline><#969696>Откройте строку игрока, чтобы посмотреть подробности.'
  boosts:
    description: '<italic:false><#e6fff3>Действующие усиления денег и опыта.<newline><#969696>В подробностях — множитель, профессии и оставшееся время.'
  help:
    description: '<italic:false><#e6fff3>Как выбрать профессию, получать награды и использовать усиления.<newline><#969696>Выберите тему, чтобы прочитать подробное объяснение.'
  admin:
    description: '<italic:false><#e6fff3>Администрирование профессий и усилителей.<newline><#969696>Наборы талонов, перезагрузка настроек и справка администратора.'
  presets:
    description: '<italic:false><#e6fff3>Настроенные наборы талонов усиления.<newline><#969696>Нажатие выдаёт талон в ваш инвентарь; усиление нужно активировать отдельно.'

