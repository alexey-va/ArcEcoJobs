name: "&#FD9113Пчеловод"
description: "&7Разводите пчел и развивайте пасеку."
unlocked-by-default: true
reset-on-quit: false
join-price: 0
leave-price: 0
xp-formula: "100 * (1.2 ^ (%level% - 1))"
max-level: 50
xp-gain-methods:
  - trigger: breed
    multiplier: 20.0
    filters:
      entities:
        - bee
      is_expression_true: "%arcecojobs_work_beekeeper_allowed%"
    conditions: []
level-placeholders:
  - id: money
    value: "7.5 * (1 + (%level% - 1) * 0.03)"
effects-description:
  1:
    - "&8• &7До &a%money% &f\U0001F4B0 &7за разведение пчелы."
rewards-description:
  1:
    - "&8• &7До &a%money% &f\U0001F4B0 &7за разведение пчелы."
level-up-messages:
  1:
    - "&8• &7До &a%money% &f\U0001F4B0 &7за разведение пчелы."
effects:
  - id: give_money
    args:
      amount: "(min(%v%, 5) * 1.5 * (1 + (%level% - 1) * 0.03)) * %arcecojobs_boost_beekeeper_money_multiplier% * %arcecojobs_earnings_beekeeper_money_marker%"
    triggers:
      - breed
    filters:
      entities:
        - bee
      is_expression_true: "%arcecojobs_work_beekeeper_allowed%"
conditions: []
