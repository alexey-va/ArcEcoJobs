name: "&#D59A4AСтроитель"
description: "&7Стройте и устанавливайте блоки."
unlocked-by-default: true
reset-on-quit: false
join-price: 0
leave-price: 0
xp-formula: "100 * (1.2 ^ (%level% - 1))"
max-level: 50
xp-gain-methods:
  - trigger: place_block
    multiplier: 1.2
    filters:
      is_expression_true: "%arcecojobs_work_builder_allowed%"
    conditions: []
level-placeholders:
  - id: money
    value: "4 * (1 + (%level% - 1) * 0.03)"
  - id: blocks
    value: "ceil(12 - %level% / 8)"
effects-description:
  1:
    - "&8• &a%money% &f\U0001F4B0 &7за каждые &e%blocks% &7установленных блоков."
rewards-description:
  1:
    - "&8• &a%money% &f\U0001F4B0 &7за каждые &e%blocks% &7установленных блоков."
level-up-messages:
  1:
    - "&8• &a%money% &f\U0001F4B0 &7за каждые &e%blocks% &7установленных блоков."
effects:
  - id: give_money
    args:
      every: "ceil(12 - %level% / 8)"
      amount: "(4 * (1 + (%level% - 1) * 0.03)) * %arcecojobs_boost_builder_money_multiplier% * %arcecojobs_earnings_builder_money_marker%"
    filters:
      is_expression_true: "%arcecojobs_work_builder_allowed%"
    triggers:
      - place_block
conditions: []
