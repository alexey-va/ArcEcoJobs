name: "&#8C6DE9Зачарователь"
description: "&7Зачаровывайте предметы на столе зачарований."
unlocked-by-default: true
reset-on-quit: false
join-price: 0
leave-price: 0
xp-formula: "100 * (1.2 ^ (%level% - 1))"
max-level: 50
xp-gain-methods:
  - trigger: enchant_item
    multiplier: 0.5
    filters:
      is_expression_true: "%arcecojobs_work_enchanter_allowed%"
    conditions: []
level-placeholders:
  - id: money
    value: "5 * (1 + (%level% - 1) * 0.03)"
effects-description:
  1:
    - "&8• &a%money% &f\U0001F4B0 &7за каждый зачарованный предмет."
rewards-description:
  1:
    - "&8• &a%money% &f\U0001F4B0 &7за каждый зачарованный предмет."
level-up-messages:
  1:
    - "&8• &a%money% &f\U0001F4B0 &7за каждый зачарованный предмет."
effects:
  - id: give_money
    args:
      amount: "(5 * (1 + (%level% - 1) * 0.03)) * %arcecojobs_boost_enchanter_money_multiplier% * %arcecojobs_earnings_enchanter_money_marker%"
    filters:
      is_expression_true: "%arcecojobs_work_enchanter_allowed%"
    triggers:
      - enchant_item
conditions: []
