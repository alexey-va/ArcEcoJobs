name: "&#57B8C2Исследователь"
description: "&7Открывайте новые чанки раньше других."
unlocked-by-default: true
reset-on-quit: false
join-price: 0
leave-price: 0
xp-formula: "100 * (1.2 ^ (%level% - 1))"
max-level: 50
xp-gain-methods:
  - trigger: custom_arcecojobs_discover_chunk
    multiplier: 1
    filters:
      is_expression_true: "%arcecojobs_work_explorer_allowed%"
    conditions: []
level-placeholders:
  - id: money
    value: "1.5 * (1 + (%level% - 1) * 0.03)"
effects-description:
  1:
    - "&8• &a%money% &f💰 &7первому исследователю чанка."
    - "&8• &7Следующим четырём: &e80%, 60%, 40% и 10%&7."
rewards-description:
  1:
    - "&8• &a%money% &f💰 &7первому исследователю чанка."
    - "&8• &7Следующим четырём: &e80%, 60%, 40% и 10%&7."
level-up-messages:
  1:
    - "&8• &a%money% &f💰 &7первому исследователю чанка."
    - "&8• &7Следующим четырём: &e80%, 60%, 40% и 10%&7."
effects:
  - id: give_money
    args:
      amount: "(1.5 * (1 + (%level% - 1) * 0.03) * %alt_trigger_value%) * %arcecojobs_boost_explorer_money_multiplier% * %arcecojobs_earnings_explorer_money_marker%"
    filters:
      is_expression_true: "%arcecojobs_work_explorer_allowed%"
    triggers:
      - custom_arcecojobs_discover_chunk
conditions: []
