name: "&eФермер"
description: "&7Собирайте созревшие культуры."
unlocked-by-default: true
reset-on-quit: false
join-price: 0
leave-price: 0
xp-formula: "100 * (1.2 ^ (%level% - 1))"
max-level: 50
xp-gain-methods:
  - trigger: mine_block
    multiplier: 0.5
    conditions: []
    filters:
      fully_grown: true
      blocks: &crops
        - wheat
        - potatoes
        - beetroots
        - carrots
        - melon
        - pumpkin
        - cocoa
        - nether_wart
        - sweet_berries
        - glow_berries
      is_expression_true: "%arcecojobs_work_farmer_allowed%"
  - trigger: mine_block_cascade
    multiplier: 0.5
    conditions: []
    filters:
      blocks: &cascade
        - cactus
        - sugar_cane
        - bamboo
      is_expression_true: "%arcecojobs_work_farmer_allowed%"
level-placeholders:
  - id: money
    value: "0.8 * (1 + (%level% - 1) * 0.03)"
effects-description:
  1:
    - "&8• &a%money% &f\U0001F4B0 &7за каждую собранную культуру."
rewards-description:
  1:
    - "&8• &a%money% &f\U0001F4B0 &7за каждую собранную культуру."
level-up-messages:
  1:
    - "&8• &a%money% &f\U0001F4B0 &7за каждую собранную культуру."
effects:
  - id: give_money
    args:
      amount: "(0.8 * (1 + (%level% - 1) * 0.03)) * %arcecojobs_boost_farmer_money_multiplier% * %arcecojobs_earnings_farmer_money_marker%"
    filters:
      fully_grown: true
      blocks: *crops
      is_expression_true: "%arcecojobs_work_farmer_allowed%"
    triggers:
      - mine_block
  - id: give_money
    args:
      amount: "(0.8 * (1 + (%level% - 1) * 0.03)) * %arcecojobs_boost_farmer_money_multiplier% * %arcecojobs_earnings_farmer_money_marker%"
    filters:
      blocks: *cascade
      is_expression_true: "%arcecojobs_work_farmer_allowed%"
    triggers:
      - mine_block_cascade
conditions: []
