name: "&#C7793EЛесоруб"
description: "&7Рубите естественно выросшие деревья."
unlocked-by-default: true
reset-on-quit: false
join-price: 0
leave-price: 0
xp-formula: "100 * (1.2 ^ (%level% - 1))"
max-level: 50
xp-gain-methods:
  - trigger: mine_block
    multiplier: 0.5
    filters:
      blocks: &logs
        - oak_log
        - spruce_log
        - birch_log
        - jungle_log
        - acacia_log
        - dark_oak_log
        - mangrove_log
        - cherry_log
        - pale_oak_log
        - crimson_stem
        - warped_stem
      player_placed: false
      is_expression_true: "%arcecojobs_work_lumberjack_allowed%"
    conditions: []
level-placeholders:
  - id: money
    value: "5 * (1 + (%level% - 1) * 0.03)"
effects-description:
  1:
    - "&8• &a%money% &f\U0001F4B0 &7за каждое природное бревно."
rewards-description:
  1:
    - "&8• &a%money% &f\U0001F4B0 &7за каждое природное бревно."
level-up-messages:
  1:
    - "&8• &a%money% &f\U0001F4B0 &7за каждое природное бревно."
effects:
  - id: give_money
    args:
      amount: "(5 * (1 + (%level% - 1) * 0.03)) * %arcecojobs_boost_lumberjack_money_multiplier% * %arcecojobs_earnings_lumberjack_money_marker%"
    triggers:
      - mine_block
    filters:
      blocks: *logs
      player_placed: false
      is_expression_true: "%arcecojobs_work_lumberjack_allowed%"
conditions: []
