name: "&#8E8464Переплавщик"
description: "&7Переплавляйте ресурсы в печах."
unlocked-by-default: true
reset-on-quit: false
join-price: 0
leave-price: 0
xp-formula: "100 * (1.2 ^ (%level% - 1))"
max-level: 50
xp-gain-methods:
  - trigger: smelt
    multiplier: 0.5
    filters:
      is_expression_true: "%arcecojobs_work_smelter_allowed%"
    conditions: []
level-placeholders:
  - id: money
    value: "0.75 * (1 + (%level% - 1) * 0.03)"
effects-description:
  1:
    - "&8• &a%money% &f\U0001F4B0 &7за каждый переплавленный предмет."
rewards-description:
  1:
    - "&8• &a%money% &f\U0001F4B0 &7за каждый переплавленный предмет."
level-up-messages:
  1:
    - "&8• &a%money% &f\U0001F4B0 &7за каждый переплавленный предмет."
effects:
  - id: give_money
    args:
      amount: "(0.75 * (1 + (%level% - 1) * 0.03)) * %arcecojobs_boost_smelter_money_multiplier% * %arcecojobs_earnings_smelter_money_marker%"
    filters:
      is_expression_true: "%arcecojobs_work_smelter_allowed%"
    triggers:
      - smelt
conditions: []
