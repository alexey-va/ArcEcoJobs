# Disposable, zero-balance test economy. Never use with a shared Redis instance.
lang: en-US
migrationEnabled: false
redis:
  host: 127.0.0.1
  port: 6385
  user: ""
  password: ""
  database: 0
  clientName: arcecojobs-e2e
  timeout: 3000
  poolSize: 2
  tryAgainCount: 3
  ssl: false
clusterId: arcecojobs-e2e
defaultCurrencyName: vault
currencies:
  - currencyName: vault
    currencySingle: coin
    currencyPlural: coins
    decimalFormat: '#0.00'
    languageTag: en-US
    startingBalance: 0.0
    maxBalance: 1000000.0
    payTax: 0.0
    saveTransactions: false
    transactionsTTL: 0
    bankEnabled: false
    taxOnlyPay: false
    executorThreads: 1
